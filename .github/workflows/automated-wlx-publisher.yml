name: Remove WLX printing

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

concurrency:
  group: wlx-publication
  cancel-in-progress: false

jobs:
  removal:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      startsWith(github.event.issue.title, '[WLX REMOVE]')
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r WLX/source/automation/requirements-test.txt

      - name: Process the removal
        id: intake
        continue-on-error: true
        env:
          RESULT_DIR: ${{ runner.temp }}/wlx-result
        run: >-
          python WLX/source/automation/process_issue.py
          --event "$GITHUB_EVENT_PATH"
          --repository-root .
          --result-dir "$RESULT_DIR"

      - name: Build the complete public release
        id: build
        if: steps.intake.outcome == 'success'
        continue-on-error: true
        run: python WLX/source/automation/build.py --repository-root .

      - name: Run every repository and importer test
        id: tests
        if: steps.intake.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s WLX/source/automation/tests -v
          python WLX/source/automation/tests/schema_validation.py --require-lxml
          python WLX/source/automation/tests/powershell_integration.py --require-pwsh

      - name: Commit the verified removal
        id: publish
        if: >-
          steps.intake.outcome == 'success' &&
          steps.build.outcome == 'success' &&
          steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "WLX Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove WLX printing from request #${ISSUE_NUMBER} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm removal on the Issue
        if: >-
          steps.intake.outcome == 'success' &&
          steps.build.outcome == 'success' &&
          steps.tests.outcome == 'success' &&
          steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_DIR: ${{ runner.temp }}/wlx-result
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RESULT_DIR/success.md"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Explain a rejected removal
        if: >-
          always() &&
          (steps.intake.outcome == 'failure' ||
           steps.build.outcome == 'failure' ||
           steps.tests.outcome == 'failure' ||
           steps.publish.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_DIR: ${{ runner.temp }}/wlx-result
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RESULT_DIR"
          if [ ! -f "$RESULT_DIR/failure.md" ]; then
            printf '%s\n\n%s\n' \
              'This removal was not published. The live WLX release is unchanged.' \
              "Validation details: ${RUN_URL}" > "$RESULT_DIR/failure.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RESULT_DIR/failure.md"
          exit 1

  validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r WLX/source/automation/requirements-test.txt
      - run: python WLX/source/automation/build.py --repository-root . --validate-only
      - run: |
          python -m unittest discover -s WLX/source/automation/tests -v
          python WLX/source/automation/tests/schema_validation.py --require-lxml
          python WLX/source/automation/tests/powershell_integration.py --require-pwsh
