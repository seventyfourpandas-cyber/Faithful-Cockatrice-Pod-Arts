name: Automated WLX Publisher

on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "automation/**"
      - "project.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/automated-wlx-publisher.yml"
      - "manifest.json"
      - "catalog.json"
      - "catalog.resolved.csv"
      - "customsets/**"
      - "images/WLX/**"
      - "cockatrice-installer/**"
      - "Willexs_Whimsical_Arts_Cockatrice_Installer.zip"
  workflow_dispatch:

concurrency:
  group: automated-wlx-publisher
  cancel-in-progress: false

jobs:
  submission:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      startsWith(github.event.issue.title, '[WLX ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned schema-test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r automation/requirements-test.txt

      - name: Process the request
        id: intake
        continue-on-error: true
        run: >-
          python automation/process_issue.py
          --event "$GITHUB_EVENT_PATH"
          --repository-root .
          --result-dir .wlx-result

      - name: Build and validate the public release
        id: build
        if: steps.intake.outcome == 'success'
        continue-on-error: true
        run: python automation/build.py --repository-root .

      - name: Run the complete automated test suite
        id: tests
        if: steps.intake.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s automation/tests -v
          python automation/tests/schema_validation.py --require-lxml
          python automation/tests/powershell_integration.py --require-pwsh

      - name: Commit the completed transaction
        id: publish
        if: >-
          steps.intake.outcome == 'success' &&
          steps.tests.outcome == 'success' &&
          steps.build.outcome == 'success'
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "WLX Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish WLX request #${ISSUE_NUMBER} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm publication on the request
        if: >-
          steps.intake.outcome == 'success' &&
          steps.tests.outcome == 'success' &&
          steps.build.outcome == 'success' &&
          steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file .wlx-result/success.md
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Explain a rejected transaction
        if: >-
          always() &&
          (steps.intake.outcome == 'failure' ||
           steps.tests.outcome == 'failure' ||
           steps.build.outcome == 'failure' ||
           steps.publish.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f .wlx-result/failure.md ]; then
            mkdir -p .wlx-result
            printf '%s\n\n%s\n' \
              'This request was not published. The current live WLX release was left unchanged.' \
              "Automated validation details: ${RUN_URL}" > .wlx-result/failure.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file .wlx-result/failure.md

      - name: Mark a rejected transaction as failed
        if: >-
          always() &&
          (steps.intake.outcome == 'failure' ||
           steps.tests.outcome == 'failure' ||
           steps.build.outcome == 'failure' ||
           steps.publish.outcome == 'failure')
        run: exit 1

  repository-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned schema-test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r automation/requirements-test.txt

      - name: Build and validate the public release
        run: python automation/build.py --repository-root .

      - name: Run the complete automated test suite
        run: |
          python -m unittest discover -s automation/tests -v
          python automation/tests/schema_validation.py --require-lxml
          python automation/tests/powershell_integration.py --require-pwsh

      - name: Commit generated corrections when needed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "WLX Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild WLX publication (${EVENT_NAME}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
