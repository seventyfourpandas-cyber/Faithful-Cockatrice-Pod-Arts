name: Import WLX card art

on:
  push:
    branches: [main]
    paths:
      - "WLX_LAYOUT_REWIRE_INSTALL.zip"
      - "WLX/CARD_MANAGER.csv"
      - "imports/incoming/**"
  workflow_dispatch:

concurrency:
  group: wlx-publication
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pending feature or process the waiting queue
        id: intake
        env:
          BATCH_ID: ${{ github.sha }}
        run: |
          if [ -f WLX_LAYOUT_REWIRE_INSTALL.zip ]; then
            install_dir="$RUNNER_TEMP/wlx-layout-rewire"
            mkdir -p "$install_dir"
            python -m zipfile -e WLX_LAYOUT_REWIRE_INSTALL.zip "$install_dir"
            python "$install_dir/install.py" \
              --repository-root . \
              --package-root "$install_dir"
            rm -f WLX_LAYOUT_REWIRE_INSTALL.zip
            echo "mode=rewire" >> "$GITHUB_OUTPUT"
          elif [ "$(python WLX/source/tools/wlx_catalog_manager.py --repository-root . --status)" = "pending" ]; then
            python WLX/source/tools/wlx_catalog_manager.py \
              --repository-root . \
              --apply
            echo "mode=manage" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f WLX/source/.wlx-bulk-importer-installed ]; then
              echo "The organized WLX importer is not installed yet." >&2
              exit 1
            fi
            python WLX/source/tools/wlx_bulk_import.py \
              --repository-root . \
              --batch-id "${BATCH_ID:0:10}"
            echo "mode=import" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse Action-installed workflow changes
        run: |
          workflow_changes="$(git status --porcelain -- .github)"
          if [ -n "$workflow_changes" ]; then
            echo "::error title=Unsafe installer payload::The Action-installed ZIP attempted to change .github. Workflow files must be uploaded manually before the ZIP runs."
            printf '%s\n' "$workflow_changes"
            exit 1
          fi

      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r WLX/source/automation/requirements-test.txt

      - name: Build the complete public release
        run: python WLX/source/automation/build.py --repository-root .

      - name: Run every repository and importer test
        run: |
          python -m unittest discover -s WLX/source/automation/tests -v
          python WLX/source/automation/tests/schema_validation.py --require-lxml
          python WLX/source/automation/tests/powershell_integration.py --require-pwsh

      - name: Show the batch result
        if: steps.intake.outputs.mode == 'import'
        run: |
          if [ -f imports/LAST_RUN.md ]; then
            cat imports/LAST_RUN.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the verified transaction
        env:
          MODE: ${{ steps.intake.outputs.mode }}
        run: |
          git config user.name "WLX Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet -- .github; then
            echo "The verified transaction unexpectedly contains a workflow change." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No repository changes were needed."
            exit 0
          fi
          if [ "$MODE" = "rewire" ]; then
            message="Finish organized WLX layout migration [skip ci]"
          elif [ "$MODE" = "manage" ]; then
            message="Apply WLX card manager edits [skip ci]"
          else
            message="Publish WLX file import ${GITHUB_SHA:0:10} [skip ci]"
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
