name: Update a double-faced printing
description: Replace either face image, edit either alternate title, or move one linked printing.
title: "[WLX UPDATE DOUBLE FACED] "
body:
  - type: markdown
    attributes:
      value: |
        Blank fields keep their current values. Enter CLEAR in an alternate-title field to remove it. Both faces keep the same collector number and shared printing UUID.
  - type: input
    id: collector
    attributes:
      label: WLX collector number
      description: Enter 006 or WLX #006.
    validations:
      required: true
  - type: dropdown
    id: player
    attributes:
      label: New player collection
      options:
        - Keep current
        - Alex
        - Will
        - Miguel
        - Jay
      default: 0
    validations:
      required: true
  - type: input
    id: front-title
    attributes:
      label: New front-face alternate printed title
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: back-title
    attributes:
      label: New back-face alternate printed title
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: upload
    id: front-image
    attributes:
      label: Replacement front-face image
      description: Optional. Upload exactly one PNG or JPEG to replace only the front image.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: upload
    id: back-image
    attributes:
      label: Replacement back-face image
      description: Optional. Upload exactly one PNG or JPEG to replace only the back image.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I verified the collector number and attached each replacement to the correct face.
          required: true
