name: "ADVANCED - Add a card printing"
description: "Add alternate titles, print an existing WLX original, or use the detailed controls."
title: "[WLX PRINTING] "
body:
  - type: markdown
    attributes:
      value: |
        This is the detailed version of Add a card printing. For transform, modal double-faced, or flip cards, use **Add a double-faced printing** instead.
  - type: dropdown
    id: player
    attributes:
      label: Player collection
      description: The source catalog and folder that should own this printing.
      options:
        - Alex
        - Will
        - Miguel
        - Jay
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Card source
      options:
        - Official Magic card
        - Existing WLX original card
    validations:
      required: true
  - type: input
    id: official-name
    attributes:
      label: Official Magic card name
      description: Required only for an official card. Use the exact English card name; split and adventure cards are supported.
      placeholder: Angel of Vitality
  - type: input
    id: custom-name
    attributes:
      label: Existing WLX original card name
      description: Required only when adding another printing of a completely original WLX card.
  - type: input
    id: alternate-title
    attributes:
      label: Alternate printed title
      description: Optional. This becomes Cockatrice's flavorName while the underlying card identity remains unchanged.
      placeholder: Alex, Divine Priest
  - type: upload
    id: image
    attributes:
      label: Finished card image
      description: Upload exactly one complete PNG or JPEG card image, at least 300x400 and no larger than 10 MiB.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg"
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked the card identity and attached the final image I want published.
          required: true
