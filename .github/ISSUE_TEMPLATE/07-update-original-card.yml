name: Update an original card definition
description: Change the shared name or rules metadata used by every printing of an original WLX card.
title: "[WLX UPDATE ORIGINAL] "
body:
  - type: markdown
    attributes:
      value: |
        Blank fields keep their current values. Enter CLEAR in an optional text field to remove its current value. Artwork changes belong in Update a Printing.
  - type: input
    id: existing-name
    attributes:
      label: Existing original card name
    validations:
      required: true
  - type: input
    id: new-name
    attributes:
      label: New card name
      description: Optional. Leave blank to keep the current name.
  - type: dropdown
    id: category
    attributes:
      label: New card category
      options:
        - Keep current
        - Regular card
        - Token
      default: 0
    validations:
      required: true
  - type: input
    id: mana-cost
    attributes:
      label: New mana cost
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: mana-value
    attributes:
      label: New mana value
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: type-line
    attributes:
      label: New type line
      description: Optional, but an original card must always retain a non-empty type line.
  - type: textarea
    id: rules-text
    attributes:
      label: New rules text
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: colors
    attributes:
      label: New colors
      description: WUBRG letters only. Leave blank to keep; enter CLEAR to remove.
  - type: input
    id: color-identity
    attributes:
      label: New color identity
      description: WUBRG letters only. Leave blank to keep; enter CLEAR to remove.
  - type: input
    id: power-toughness
    attributes:
      label: New power/toughness
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: loyalty
    attributes:
      label: New loyalty
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: input
    id: defense
    attributes:
      label: New defense
      description: Leave blank to keep it; enter CLEAR to remove it.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand that these rules changes apply to every active printing of this original WLX card.
          required: true
