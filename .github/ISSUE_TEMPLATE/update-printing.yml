name: Update a printing or its artwork
description: Replace an image, change its alternate title, move its player folder, or correct its official identity.
title: "[WLX UPDATE PRINTING] "
body:
  - type: input
    id: collector
    attributes:
      label: WLX collector number
      description: Enter 002 or WLX #002.
    validations:
      required: true
  - type: dropdown
    id: player
    attributes:
      label: New player collection
      description: Choose Keep current unless this printing should move to a different player's source folder.
      options:
        - Keep current
        - Alex
        - Will
        - Miguel
        - Jay
      default: 0
    validations:
      required: true
  - type: input
    id: alternate-title
    attributes:
      label: New alternate printed title
      description: Leave blank to keep it. Enter CLEAR to remove an existing alternate title.
  - type: input
    id: official-name
    attributes:
      label: New official Magic card name
      description: Optional correction for official-card printings only. Leave blank to keep the current identity.
  - type: upload
    id: image
    attributes:
      label: Replacement card image
      description: Optional. Upload exactly one PNG or JPEG to replace the current image while preserving this printing's collector number and UUID.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I verified the collector number and every change entered above.
          required: true
